    <section class="contacthtml" id="contact">
        <div class="contact-container">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <h3 class="contact-header">Let's create something amazing together</h3>
                    <p>Have a project in mind? I'd love to hear about it. Send me a message and let's discuss how we can bring your vision to life.</p>
                </div>
                <form class="contact-form" id="contactForm">
    <div class="form-container">
        <div class="form-group">
            <i class='bx bx-user'></i>
            <input type="text" id="name" placeholder=" " required>
            <label for="name">Your Name</label>
        </div>
        <div class="form-group">
            <i class='bx bx-envelope'></i>
            <input type="email" id="email" placeholder=" " required>
            <label for="email">Your Email</label>
        </div>
        <div class="form-group">
            <i class='bx bx-message-dots'></i>
            <textarea id="message" placeholder=" " rows="5" required></textarea>
            <label for="message">Your Message</label>
        </div>
    </div>
    <button type="submit" class="btn-primary">
        <i class='bx bx-send'></i>
        <span>Send Message</span>
    </button>
</form>
            </div>
        </div>
    </section>
